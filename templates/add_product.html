
{% extends "base.html" %}

{% block title %}Add Product | InventoryPro{% endblock %}

{% block content %}

<div class="mb-4">
    <h1 class="fw-bold">Add Product</h1>
    <p class="text-secondary">Enter the details of your new inventory item.</p>
</div>

<div class="card border-0 shadow-sm rounded-4 p-4" style="max-width: 800px;">

    <form method="POST" action="{{ url_for('add_product') }}" class="row g-3">

        <div class="col-md-6">
            <label class="form-label">Product Name</label>
            <input
                class="form-control"
                name="product_name"
                placeholder="e.g. Wireless Mouse"
                required>
        </div>

        <div class="col-md-6">
            <label class="form-label">SKU</label>
            <input
                class="form-control"
                name="sku"
                placeholder="e.g. ACC-002"
                required>
            <div class="form-text">Each product must have a unique SKU.</div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Category</label>
            <select class="form-select" name="category_id">
                <option value="">No category</option>
                {% for c in categories %}
                    <option value="{{ c.category_id }}">
                        {{ c.category_name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-6">
            <label class="form-label">Price (₹)</label>
            <input
                class="form-control"
                name="price"
                type="number"
                min="0"
                step="0.01"
                placeholder="599.00"
                required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Stock Quantity</label>
            <input
                class="form-control"
                name="stock_quantity"
                type="number"
                min="0"
                placeholder="10"
                required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Reorder Level</label>
            <input
                class="form-control"
                name="reorder_level"
                type="number"
                min="0"
                value="5"
                required>
        </div>

        <div class="col-12 mt-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-primary">
                Save Product
            </button>

            <a href="{{ url_for('products') }}"
               class="btn btn-outline-secondary ms-2">
                Cancel
            </a>
        </div>

    </form>
</div>

{% endblock %}

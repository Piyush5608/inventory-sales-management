
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restock Inventory | InventoryPro</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-5" style="max-width: 700px">

    <div class="mb-4">
        <a href="/" class="text-decoration-none">&larr; Back to Dashboard</a>
        <h1 class="fw-bold mt-3">Restock Inventory</h1>
        <p class="text-secondary">
            Add incoming stock to an existing product.
        </p>
    </div>

    {% for message in get_flashed_messages() %}
        <div class="alert alert-info">{{ message }}</div>
    {% endfor %}

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">

            <form method="POST" class="d-grid gap-3">

                <div>
                    <label for="product_id" class="form-label fw-semibold">
                        Select Product
                    </label>

                    <select
                        id="product_id"
                        name="product_id"
                        class="form-select"
                        required>

                        <option value="">Choose a product</option>

                        {% for p in products %}
                            <option value="{{ p.product_id }}">
                                {{ p.product_name }} — Current stock:
                                {{ p.stock_quantity }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="quantity" class="form-label fw-semibold">
                        Quantity to Add
                    </label>

                    <input
                        id="quantity"
                        type="number"
                        name="quantity"
                        class="form-control"
                        min="1"
                        step="1"
                        placeholder="Enter incoming quantity"
                        required>
                </div>

                <div>
                    <label for="notes" class="form-label fw-semibold">
                        Notes (Optional)
                    </label>

                    <input
                        id="notes"
                        type="text"
                        name="notes"
                        class="form-control"
                        maxlength="255"
                        placeholder="e.g. New supplier delivery">
                </div>

                <button type="submit" class="btn btn-success btn-lg">
                    + Add Stock
                </button>

                <a href="/products" class="btn btn-outline-secondary">
                    View Products
                </a>

            </form>
        </div>
    </div>

</div>
</body>
</html>
